[pytest]
# Scope default collection to the foundation/zoo test suite so a bare `pytest`
# (and the G3 smoke-grid CI gate) does not choke on pre-existing broken scratch
# under bench/ and coda_experiments/_archive/ (the latter is gitignored). Explicit
# paths still work (e.g. `pytest tests/zoo/test_harness.py`); the repo-root
# conftest.py (sys.path setup) still loads regardless of testpaths.
testpaths = tests
